files_config:
  area: un_p15.area
  check: un_p15.chk
  conductivity: un_p15.cond
  error: un_p15.err
  files: fehmn.files
  final_conditions: un_p15.fin
  grid: un_p15.fehm
  heat_flux: un_p15.hflx
  flow: un_p15.flow
  history: un_p15.hist
  input: un_p15.dat
  material_zone: un_p15_material.zone
  output: un_p15.out
  outside_zone: un_p15_outside.zone
  permeability: un_p15.perm
  pore_pressure: un_p15.ppor
  rock_properties: un_p15.rock
  run_root: un_p15
  storage: un_p15.stor
  water_properties: un_p15.wpi
heat_flux_config:
  boundary_configs:
  - boundary_model:
      kind: constant_MW_per_m2
      params:
        constant: 0.00000001
    outside_zones: [bottom]
flow_config:
  boundary_configs:
  - boundary_model:
      kind: 'open_flow'
      params:
        input_fluid_temp_degC: 2
        aiped_to_volume_ratio: 1.0e-08
    outside_zones: ['top']
rock_properties_config:
  compressibility_configs:
  - property_model:
      kind: overburden
      params:
        a: 0.09
        grav: 9.81
        min_overburden: 25
        rhow: 1000
    zones: [1, 2, 3]
  conductivity_configs:
  - property_model:
      kind: porosity_weighted
      params:
        rock_conductivity: 2.5
        water_conductivity: 0.62
    zones: [1, 2, 3]
  grain_density_configs:
  - property_model:
      kind: constant
      params:
        constant: 3400
    zones: [1, 2, 3]
  permeability_configs:
  - property_model:
      kind: constant
      params:
        constant: 1.0E-15
    zones: [1, 2, 3]
  porosity_configs:
  - property_model:
      kind: constant
      params:
        constant: 0.1
    zones: [1, 2, 3]
  specific_heat_configs:
  - property_model:
      kind: constant
      params:
        constant: 800
    zones: [1, 2, 3]
  zone_assignment_order: [1, 2, 3]