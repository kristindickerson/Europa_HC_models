files_config:
  area: s5_p15un_l_cold_0fr_sm0.area
  check: s5_p15un_l_cold_0fr_sm0.chk
  conductivity: s5_p15un_l_cold_0fr_sm0.cond
  error: s5_p15un_l_cold_0fr_sm0.err
  files: fehmn.files
  final_conditions: s5_p15un_l_cold_0fr_sm0.fin
  grid: s5_p15un_l_cold_0fr_sm0.fehm
  heat_flux: s5_p15un_l_cold_0fr_sm0.hflx
  flow: s5_p15un_l_cold_0fr_sm0.flow
  history: s5_p15un_l_cold_0fr_sm0.hist
  input: s5_p15un_l_cold_0fr_sm0.dat
  material_zone: s5_p15un_l_cold_0fr_sm0_material.zone
  output: s5_p15un_l_cold_0fr_sm0.out
  outside_zone: s5_p15un_l_cold_0fr_sm0_outside.zone
  permeability: s5_p15un_l_cold_0fr_sm0.perm
  pore_pressure: s5_p15un_l_cold_0fr_sm0.ppor
  rock_properties: s5_p15un_l_cold_0fr_sm0.rock
  run_root: s5_p15un_l_cold_0fr_sm0
  storage: s5_p15un_l_cold_0fr_sm0.stor
  water_properties: s5_p15un_l_cold_0fr_sm0.wpi

heat_flux_config:
  boundary_configs:
  - boundary_model:
      kind: constant_MW_per_m2
      params:
        constant: 10
    outside_zones: ['bottom']
    material_zones: []  # these can also be omitted if empty
flow_config:
  boundary_configs:
  - boundary_model:
      kind: 'open_flow'
      params:
        input_fluid_temp_degC: 2
        aiped_to_volume_ratio: 1.0e-08
    outside_zones: ['top']
    material_zones: []  # these can also be omitted if empty (done with outside_zones below)
rock_properties_config:
  compressibility_configs:
  - property_model:
      kind: overburden
      params:
        a: 0.09
        grav: 1.3
        min_overburden: 25
        rhow: 1000
    zones: [1]
  - property_model:
      kind: constant
      params:
        constant: 6.0E-10
    zones: [2, 3]
  conductivity_configs:
  - property_model:
      kind: porosity_weighted
      params:
        rock_conductivity: 2.05
        water_conductivity: 0.62
    zones: [1]
  - property_model:
      kind: porosity_weighted
      params:
        rock_conductivity: 2.05
        water_conductivity: 0.62
    zones: [2, 3]
  grain_density_configs:
  - property_model:
      kind: constant
      params:
        constant: 2650
    zones: [1]
  - property_model:
      kind: constant
      params:
        constant: 2700
    zones: [2]
  - property_model:
      kind: constant
      params:
        constant: 3400
    zones: [3]
  permeability_configs:
  - property_model:
      kind: constant
      params:
        constant: 1.0E-15
    zones: [1, 2, 3]
  porosity_configs:
  - property_model:
      kind: depth_power_law_with_maximum
      params:
        porosity_a: 0.84
        porosity_b: -0.125
    zones: [1]
  - property_model:
      kind: constant
      params:
        constant: 0.1
    zones: [2]
  - property_model:
      kind: constant
      params:
        constant: 0.05
    zones: [3]
  specific_heat_configs:
  - property_model:
      kind: constant
      params:
        constant: 800
    zones: [1, 2, 3]
  zone_assignment_order: [1, 2, 3]