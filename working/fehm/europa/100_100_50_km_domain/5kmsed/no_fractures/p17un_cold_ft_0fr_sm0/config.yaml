files_config:
  area: p17un_cold_ft_0fr_sm0.area
  check: p17un_cold_ft_0fr_sm0.chk
  conductivity: p17un_cold_ft_0fr_sm0.cond
  error: p17un_cold_ft_0fr_sm0.err
  files: fehmn.files
  final_conditions: p17un_cold_ft_0fr_sm0.fin
  flow: p17un_cold_ft_0fr_sm0.flow
  grid: p17un_cold_ft_0fr_sm0.fehm
  heat_flux: p17un_cold_ft_0fr_sm0.hflx
  history: p17un_cold_ft_0fr_sm0.hist
  initial_conditions: p17un_cold_ft_0fr_sm0.ini
  input: p17un_cold_ft_0fr_sm0.dat
  material_zone: p17un_cold_ft_0fr_sm0_material.zone
  output: p17un_cold_ft_0fr_sm0.out
  outside_zone: p17un_cold_ft_0fr_sm0_outside.zone
  permeability: p17un_cold_ft_0fr_sm0.perm
  pore_pressure: p17un_cold_ft_0fr_sm0.ppor
  rock_properties: p17un_cold_ft_0fr_sm0.rock
  run_root: p17un_cold_ft_0fr_sm0
  storage: p17un_cold_ft_0fr_sm0.stor
  water_properties: p17un_cold_ft_0fr_sm0.wpi
flow_config:
  boundary_configs:
  - boundary_model:
      kind: open_flow
      params:
        aiped_to_volume_ratio: !!python/object/apply:decimal.Decimal
        - '1.000000000E-8'
        input_fluid_temp_degC: 2
    material_zones: []
    outside_zones:
    - top
heat_flux_config:
  boundary_configs:
  - boundary_model:
      kind: constant_MW_per_m2
      params:
        constant: 0
    material_zones: []
    outside_zones:
    - bottom
rock_properties_config:
  compressibility_configs:
  - property_model:
      kind: constant
      params:
        constant: !!python/object/apply:decimal.Decimal
        - '6.000000000E-10'
    zones:
    - 1
    - 2
    - 3
  conductivity_configs:
  - property_model:
      kind: porosity_weighted
      params:
        rock_conductivity: !!python/object/apply:decimal.Decimal
        - '2.500000000'
        water_conductivity: !!python/object/apply:decimal.Decimal
        - '0.6200000000'
    zones:
    - 1
    - 2
    - 3
  grain_density_configs:
  - property_model:
      kind: constant
      params:
        constant: 3400
    zones:
    - 1
    - 2
    - 3
  permeability_configs:
  - property_model:
      kind: constant
      params:
        constant: !!python/object/apply:decimal.Decimal
        - '1.000000000E-15'
    zones:
    - 1
    - 2
    - 3
  porosity_configs:
  - property_model:
      kind: constant
      params:
        constant: !!python/object/apply:decimal.Decimal
        - '0.1000000000'
    zones:
    - 1
    - 2
    - 3
  specific_heat_configs:
  - property_model:
      kind: constant
      params:
        constant: 800
    zones:
    - 1
    - 2
    - 3
  zone_assignment_order:
  - 1
  - 2
  - 3
