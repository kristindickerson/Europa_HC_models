files_config:
  area: ea_p15un_warm.area
  check: ea_p15un_warm.chk
  conductivity: ea_p15un_warm.cond
  error: ea_p15un_warm.err
  files: fehmn.files
  final_conditions: ea_p15un_warm.fin
  grid: ea_p15un_warm.fehm
  heat_flux: ea_p15un_warm.hflx
  flow: ea_p15un_warm.flow
  history: ea_p15un_warm.hist
  input: ea_p15un_warm.dat
  material_zone: ea_p15un_warm_material.zone
  output: ea_p15un_warm.out
  outside_zone: ea_p15un_warm_outside.zone
  permeability: ea_p15un_warm.perm
  pore_pressure: ea_p15un_warm.ppor
  rock_properties: ea_p15un_warm.rock
  run_root: ea_p15un_warm
  storage: ea_p15un_warm.stor
  water_properties: ea_p15un_warm.wpi
heat_flux_config:
  boundary_configs:
  - boundary_model:
      kind: constant_MW_per_m2
      params:
        constant: 0.00000001
    outside_zones: [bottom]
flow_config:
  boundary_configs:
  - boundary_model:
      kind: 'open_flow'
      params:
        input_fluid_temp_degC: 2
        aiped_to_volume_ratio: 1.0e-08
    outside_zones: ['top']
rock_properties_config:
  compressibility_configs:
  - property_model:
      kind: overburden
      params:
        a: 0.09
        grav: 9.81
        min_overburden: 25
        rhow: 1000
    zones: [1, 2, 3]
  conductivity_configs:
  - property_model:
      kind: porosity_weighted
      params:
        rock_conductivity: 2.5
        water_conductivity: 0.62
    zones: [1, 2, 3]
  grain_density_configs:
  - property_model:
      kind: constant
      params:
        constant: 3400
    zones: [1, 2, 3]
  permeability_configs:
  - property_model:
      kind: constant
      params:
        constant: 1.0E-15
    zones: [1, 2, 3]
  porosity_configs:
  - property_model:
      kind: constant
      params:
        constant: 0.1
    zones: [1, 2, 3]
  specific_heat_configs:
  - property_model:
      kind: constant
      params:
        constant: 800
    zones: [1, 2, 3]
  zone_assignment_order: [1, 2, 3]