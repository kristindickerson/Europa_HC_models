files_config:
  area: eu_p15un_cold_ft.area
  check: eu_p15un_cold_ft.chk
  conductivity: eu_p15un_cold_ft.cond
  error: eu_p15un_cold_ft.err
  files: fehmn.files
  final_conditions: eu_p15un_cold_ft.fin
  grid: eu_p15un_cold_ft.fehm
  heat_flux: eu_p15un_cold_ft.hflx
  flow: eu_p15un_cold_ft.flow
  history: eu_p15un_cold_ft.hist
  input: eu_p15un_cold_ft.dat
  material_zone: eu_p15un_cold_ft_material.zone
  output: eu_p15un_cold_ft.out
  outside_zone: eu_p15un_cold_ft_outside.zone
  permeability: eu_p15un_cold_ft.perm
  pore_pressure: eu_p15un_cold_ft.ppor
  rock_properties: eu_p15un_cold_ft.rock
  run_root: eu_p15un_cold_ft
  storage: eu_p15un_cold_ft.stor
  water_properties: eu_p15un_cold_ft.wpi
heat_flux_config:
  boundary_configs:
  - boundary_model:
      kind: constant_MW_per_m2
      params:
        constant: 0.00000001
    outside_zones: [bottom]
flow_config:
  boundary_configs:
  - boundary_model:
      kind: 'open_flow'
      params:
        input_fluid_temp_degC: 2
        aiped_to_volume_ratio: 1.0e-08
    outside_zones: ['top']
rock_properties_config:
  compressibility_configs:
  - property_model:
      kind: overburden
      params:
        a: 0.09
        grav: 9.81
        min_overburden: 25
        rhow: 1000
    zones: [1, 2, 3]
  conductivity_configs:
  - property_model:
      kind: porosity_weighted
      params:
        rock_conductivity: 2.5
        water_conductivity: 0.62
    zones: [1, 2, 3]
  grain_density_configs:
  - property_model:
      kind: constant
      params:
        constant: 3400
    zones: [1, 2, 3]
  permeability_configs:
  - property_model:
      kind: constant
      params:
        constant: 1.0E-15
    zones: [1, 2, 3]
  porosity_configs:
  - property_model:
      kind: constant
      params:
        constant: 0.1
    zones: [1, 2, 3]
  specific_heat_configs:
  - property_model:
      kind: constant
      params:
        constant: 800
    zones: [1, 2, 3]
  zone_assignment_order: [1, 2, 3]